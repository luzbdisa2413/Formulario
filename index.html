<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario con Validación</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
        }

        header{
            background:#0d6efd;
            color:white;
            text-align:center;
            padding:20px;
        }

        main{
            max-width:700px;
            margin:30px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        footer{
            background:#212529;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:30px;
        }

        .error{
            color:red;
            font-size:14px;
        }

        input:focus{
            border:2px solid blue;
        }
    </style>

</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Formulario con Validación</h1>
    </header>

    <!-- MAIN -->
    <main>

        <form id="formulario">

            <div class="mb-3">
                <label class="form-label">Nombre</label>

                <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    placeholder="Ingrese su nombre">

                <div id="errorNombre" class="error"></div>
            </div>


            <div class="mb-3">
                <label class="form-label">Apellido</label>

                <input
                    type="text"
                    class="form-control"
                    id="apellido"
                    placeholder="Ingrese su apellido">

                <div id="errorApellido" class="error"></div>
            </div>


            <div class="mb-3">

                <label class="form-label">Correo</label>

                <input
                    type="email"
                    class="form-control"
                    id="correo"
                    placeholder="correo@ejemplo.com">

                <div id="errorCorreo" class="error"></div>

            </div>


            <div class="mb-3">

                <label class="form-label">Género</label>

                <br>

                <input type="radio" name="genero" value="Hombre">
                Hombre

                <br>

                <input type="radio" name="genero" value="Mujer">
                Mujer

                <div id="errorGenero" class="error"></div>

            </div>


            <div class="mb-3">

                <input type="checkbox" id="terminos">

                Acepto los términos y condiciones

                <div id="errorTerminos" class="error"></div>

            </div>


            <button class="btn btn-primary" type="submit">
                Enviar
            </button>

        </form>

    </main>

    <!-- FOOTER -->
    <footer>

        <h5>Realizado por: Biviana Diaz</h5>

        <p>
            GitHub:
            <a href="https://github.com/luzbdisa2413" target="_blank" class="text-warning">
                https://github.com/luzbdisa2413
            </a>
        </p>

    </footer>


<script>

let formulario = document.getElementById("formulario");

formulario.addEventListener("submit", function(event){

    event.preventDefault();

    let nombre = document.getElementById("nombre").value;
    let apellido = document.getElementById("apellido").value;
    let correo = document.getElementById("correo").value;
    let genero = document.querySelector('input[name="genero"]:checked');
    let terminos = document.getElementById("terminos").checked;

    document.getElementById("errorNombre").innerHTML="";
    document.getElementById("errorApellido").innerHTML="";
    document.getElementById("errorCorreo").innerHTML="";
    document.getElementById("errorGenero").innerHTML="";
    document.getElementById("errorTerminos").innerHTML="";

    let valido = true;

    if(nombre==""){
        document.getElementById("errorNombre").innerHTML="Ingrese el nombre";
        valido=false;
    }

    if(apellido==""){
        document.getElementById("errorApellido").innerHTML="Ingrese el apellido";
        valido=false;
    }

    if(correo==""){
        document.getElementById("errorCorreo").innerHTML="Ingrese el correo";
        valido=false;
    }

    if(genero==null){
        document.getElementById("errorGenero").innerHTML="Seleccione un género";
        valido=false;
    }

    if(!terminos){
        document.getElementById("errorTerminos").innerHTML="Debe aceptar los términos";
        valido=false;
    }

    if(valido){
        alert("Formulario enviado correctamente");
        formulario.reset();
    }

});

</script>

</body>
</html>
